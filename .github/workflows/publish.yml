name: brew pr-pull

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  gate:
    # A fork's pull request carries no entry in workflow_run.pull_requests, and its
    # bottles must never reach main without a maintainer dispatching the run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # A draft marks a change a maintainer must read before it ships, such as a
      # version bump that also changes how felis is packaged.
      publish: ${{ github.event_name == 'workflow_dispatch' || steps.draft.outputs.draft == 'false' }}
    steps:
      - name: Check for a draft pull request
        id: draft
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          draft=$(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  pr-pull:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          branch: main

      # pr-pull leaves the release body empty, and GitHub then shows the message
      # of the commit the tag points at, which predates the formula change.
      - name: Describe releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOTTLE_PATH: ${{ steps.pull_bottles.outputs.bottle_path }}
        run: |
          tap="${GITHUB_REPOSITORY/\/homebrew-//}"
          jq -r '.[] | [(.bottle.root_url | split("/") | last), .formula.name, .formula.pkg_version, .formula.homepage] | @tsv' \
            "$BOTTLE_PATH"/*.bottle.json | sort -u |
            while IFS=$'\t' read -r tag name version homepage
            do
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$name $version" --notes \
                "Bottles for [$name ${version%_*}]($homepage/releases/tag/v${version%_*}). Install with \`brew install $tap/$name\`."
            done

      # pr-pull closes the pull request instead of merging it, so GitHub's
      # automatic head-branch deletion never fires. The refs API names the branch
      # unambiguously; git push --delete fails once the release tag shares its name.
      - name: Delete pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number }}
        run: |
          read -r cross_repo branch < <(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" \
            --json isCrossRepository,headRefName --jq '"\(.isCrossRepository) \(.headRefName)"')
          if [[ "$cross_repo" == false ]]
          then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
